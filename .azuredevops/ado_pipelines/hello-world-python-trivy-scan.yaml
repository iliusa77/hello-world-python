stages:
- stage: BuildAndScan
  displayName: Build & Security Scan
  jobs:
  - job: Build
    displayName: Build Docker image
    pool:
      vmImage: ubuntu-latest

    steps:
    - checkout: self

    - task: Docker@2
      displayName: Build image
      inputs:
        command: build
        repository: iliusa77/hello-world-python
        dockerfile: Dockerfile
        tags: |
          $(Build.BuildId)

    - task: Trivy@1
      displayName: Trivy scan Docker image
      inputs:
        image: iliusa77/hello-world-python:$(Build.BuildId)
        severity: HIGH,CRITICAL
        exitCode: '0'
        format: 'json'

    - task: Bash@3
      displayName: 'Read Trivy Scan Results'
      condition: succeededOrFailed()
      inputs:
        targetType: 'inline'
        script: |
          echo "=== Trivy Scan Results ==="
          ls -la $(Agent.TempDirectory)/trivy/
          echo ""
          echo "=== Scan Report ==="
          cat $(Agent.TempDirectory)/trivy/*.json | jq '.' || cat $(Agent.TempDirectory)/trivy/*.json
          echo ""
          echo "=== Summary ==="
          cat $(Agent.TempDirectory)/trivy/*.json | jq '.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH") | {Severity, VulnerabilityID, PkgName, InstalledVersion}' || echo "No critical or high vulnerabilities found or jq not available"

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Trivy Scan Results'
      condition: succeededOrFailed()
      inputs:
        PathtoPublish: '$(Agent.TempDirectory)/trivy'
        ArtifactName: 'TrivyScanResults'
        publishLocation: 'Container'
